<script>
const areas=['학습 동기','계획·실행력','집중·시간관리','학습 방법','시험 대처','자기주도성','학습 정서','학습 환경·관계'];
const raw=[
['나는 공부를 해야 하는 이유를 알고 있다.','새로운 것을 배우면 더 알아보고 싶어진다.','나는 공부를 통해 이루고 싶은 목표가 있다.','공부를 잘했을 때 스스로 뿌듯함을 느낀다.','칭찬이나 상이 없어도 공부를 열심히 하고 싶다.','어려운 공부도 잘하고 싶어서 노력한다.','나는 공부를 잘할 수 있다고 생각한다.','공부를 왜 해야 하는지 모르겠을 때가 많다.'],
['나는 숙제나 공부를 언제 할지 미리 정한다.','공부를 시작하기 전에 무엇부터 할지 생각한다.','하루에 공부할 분량을 정해 놓는다.','내가 세운 공부 계획을 끝까지 지키려고 노력한다.','하기 싫은 숙제는 자꾸 뒤로 미룬다.','계획대로 하지 못했을 때 이유를 생각해 본다.','시간이 부족하면 중요한 공부부터 한다.','공부 계획을 세우기만 하고 실천하지 못할 때가 많다.'],
['공부할 때 다른 생각이 자주 난다.','공부를 시작하면 한동안 집중할 수 있다.','휴대폰이나 게임 때문에 공부가 늦어진 적이 많다.','공부하는 동안 필요 없는 물건은 치워 둔다.','쉬는 시간이 길어져 공부를 늦게 시작할 때가 많다.','정해 놓은 시간 안에 숙제를 끝내려고 노력한다.','주변이 조금 시끄러워도 공부를 계속할 수 있다.','공부하다 딴짓을 했다는 것을 알아차리면 다시 집중하려고 한다.'],
['모르는 내용은 그냥 넘어가지 않고 확인한다.','배운 내용을 내 말로 설명해 보기도 한다.','외운 것을 며칠 뒤에 다시 확인한다.','틀린 문제는 왜 틀렸는지 생각해 본다.','문제를 맞혔어도 풀이가 헷갈리면 다시 확인한다.','중요한 내용을 표시하거나 정리하며 공부한다.','시험이 끝나면 틀린 문제를 다시 살펴본다.','공부할 때 읽기만 하고 제대로 이해했는지 확인하지 않을 때가 많다.'],
['시험이나 평가를 앞두고 미리 준비하는 편이다.','시험을 보기 전에 중요한 내용을 다시 확인한다.','시험 문제를 풀 때 질문을 끝까지 읽는다.','시험을 볼 때 긴장해서 아는 것도 틀릴 때가 있다.','문제를 다 풀면 빠뜨린 것이 없는지 확인한다.','시험에서 틀린 문제를 보면 다음에는 어떻게 할지 생각한다.','시험 공부를 마지막 날에 몰아서 할 때가 많다.','시험 점수가 기대보다 낮아도 다음 시험을 준비하려고 노력한다.'],
['부모님이 말씀하시기 전에 스스로 공부를 시작한다.','어려운 문제가 나오면 먼저 혼자 해결하려고 해 본다.','혼자 해결하기 어려울 때는 질문하거나 도움을 요청한다.','숙제를 다 했는지 스스로 확인한다.','공부할 때 필요한 준비물을 스스로 챙긴다.','누가 확인하지 않아도 해야 할 공부를 하려고 노력한다.','내가 무엇을 잘하고 무엇이 부족한지 생각해 본다.','누군가 시키지 않으면 공부를 거의 시작하지 않는다.'],
['어려운 문제를 만나도 다시 도전할 수 있다.','문제를 틀리면 내가 공부를 못하는 것 같아 속상하다.','노력하면 지금보다 공부를 더 잘할 수 있다고 생각한다.','다른 친구보다 점수가 낮으면 자신감이 떨어진다.','공부하다 실수해도 다시 해보려고 한다.','새로운 공부를 시작할 때 실패할까 봐 걱정된다.','내가 잘하는 공부나 과목이 있다고 생각한다.','공부가 잘 안되는 날에도 다음에 다시 노력할 수 있다.'],
['나는 집중이 잘되는 공부 장소를 알고 있다.','내가 공부할 때 가족이 어떤 도움을 주면 좋은지 알고 있다.','부모님과 공부 이야기를 편하게 나눌 수 있다.','공부에 관한 부모님의 말씀 때문에 부담을 느낄 때가 있다.','모르는 것이 있을 때 편하게 물어볼 사람이 있다.','혼자 공부하는 것과 함께 공부하는 것 중 나에게 더 잘 맞는 방법을 알고 있다.','공부할 때 방해가 되는 것이 무엇인지 알고 있다.','부모님과 내가 생각하는 나의 공부 습관은 비슷하다고 느낀다.']];
const variations={mid:{0:'나는 내가 공부하는 이유를 분명하게 알고 있다.',8:'나는 학습 시간과 과목별 분량을 미리 계획한다.',24:'이해되지 않는 개념은 스스로 확인하고 넘어간다.',40:'부모님의 지시 없이 스스로 학습을 시작한다.'},high:{0:'나는 현재 학습 목표와 공부해야 하는 이유를 명확히 인식하고 있다.',8:'나는 학습량과 일정에 맞춰 과목별 우선순위를 계획한다.',24:'이해가 부족한 개념은 추가 자료를 활용해 확인한다.',40:'외부의 지시 없이 스스로 학습을 시작하고 관리한다.'}};
const reverse=new Set([7,12,15,16,18,20,23,31,35,38,46,49,51,53,59]);
const explanations=[
['학습의 의미와 목표를 비교적 분명하게 느끼는 모습입니다.','공부하는 이유와 자신에게 중요한 목표를 짧게 이야기해 보세요.','이번 주 공부를 통해 얻고 싶은 것 한 가지를 적어 보세요.'],
['계획을 세우고 실천하는 습관을 긍정적으로 평가하고 있습니다.','계획이 실제 행동으로 이어지는지 점검하면 도움이 됩니다.','하루 계획은 가장 중요한 과제 세 가지로 시작해 보세요.'],
['집중을 유지하고 시간을 활용하는 습관을 긍정적으로 평가합니다.','집중을 방해하는 상황과 시간대를 관찰해 보세요.','공부 시작 전 방해 요소 한 가지를 치워 보세요.'],
['이해를 확인하고 복습하는 공부 방법을 활용하는 편입니다.','공부한 내용을 실제로 기억하고 설명할 수 있는지 살펴보세요.','배운 개념 하나를 책을 덮고 설명해 보세요.'],
['평가 준비와 시험 이후 점검 습관을 긍정적으로 평가합니다.','시험 준비 과정과 긴장 반응을 함께 돌아보면 좋습니다.','틀린 문제 중 하나의 실수 원인을 기록해 보세요.'],
['스스로 공부를 시작하고 점검하는 경향을 보입니다.','도움이 필요한 순간과 스스로 해볼 순간을 구분해 보세요.','공부를 시작하는 시간을 스스로 정해 보세요.'],
['어려움이 생겨도 다시 시도할 수 있다고 느끼는 편입니다.','공부 중 감정 변화와 회복 방법을 함께 살펴보세요.','힘들었던 순간에 도움이 된 행동 하나를 적어 보세요.'],
['자신에게 맞는 공부 환경과 주변 도움을 인식하는 편입니다.','어떤 공간과 관계에서 편안하게 공부하는지 확인해 보세요.','집중이 잘되는 환경의 조건 두 가지를 정리해 보세요.']
];

function start(){let name=document.getElementById('studentName').value.trim();if(!name){alert('보고서에 표시할 학생 이름을 입력해 주세요.');document.getElementById('studentName').focus();return}state.info={grade:document.getElementById('grade').value,name};state.answers=Array(64).fill(null);state.index=0;state.page='question';render()}
function question(){
const i=state.index,k=Math.floor(i/8),q=(variations[state.info.grade]||{})[i]||raw[k][i%8];
shell(`<div class="brand">${esc(areas[k])}</div><div class="bar" style="margin-top:14px"><div style="width:${(i+1)/64*100}%"></div></div><p class="muted small">${i+1} / 64문항</p><h2>${esc(q)}</h2><p class="muted small">평소 나의 모습에 가장 가까운 답을 선택하세요.</p>${['전혀 그렇지 않다','그렇지 않은 편이다','보통이다','그런 편이다','매우 그렇다'].map((t,j)=>`<label class="option"><input type="radio" name="answer" value="${j+1}" ${state.answers[i]===j+1?'checked':''} onchange="answer(${j+1})">${t}</label>`).join('')}<div class="actions"><button class="btn secondary" onclick="previous()" ${i===0?'disabled':''}>이전</button><button class="btn" id="next" onclick="next()" ${state.answers[i]===null?'disabled':''}>${i===63?'결과 확인':'다음 →'}</button></div>`);
}
function answer(v){state.answers[state.index]=v;document.getElementById('next').disabled=false}
function previous(){state.index=Math.max(0,state.index-1);render()}
function next(){if(state.answers[state.index]===null)return;if(state.index<63)state.index++;else{state.page='result';compute();}render()}
function compute(){state.scores=areas.map((_,k)=>{let sum=0;for(let j=0;j<8;j++){let idx=k*8+j,v=state.answers[idx];sum+=reverse.has(idx)?6-v:v}return Math.round((sum-8)/32*100)})}
function scoreRows(){return areas.map((a,i)=>`<div class="score"><div class="scorehead"><b>${a}</b><b>${state.scores[i]}점</b></div><div class="mini"><div style="width:${state.scores[i]}%"></div></div></div>`).join('')}

{meaning:'학습량을 정하고 우선순위를 세운 뒤 실제 행동으로 옮기는 습관을 살펴봅니다.',strong:'공부를 시작하기 전에 해야 할 일을 정리하고 계획을 실천하려는 태도를 스스로 긍정적으로 평가하고 있습니다.',check:'계획을 세우는 일과 실제로 실행하는 일은 다를 수 있습니다. 일정이 밀렸을 때 계획을 조정하고 다시 시작하는 방법을 점검해 보세요.',student:'하루의 필수 과제 세 가지를 정하고, 완료 여부보다 실행을 막았던 이유를 한 줄 기록해 보세요.',parent:'계획표를 매번 검사하기보다 학생이 스스로 실천 여부를 돌아볼 시간을 마련해 주세요. 계획을 지키지 못했을 때는 원인과 다음 조정을 함께 이야기해 보세요.'},
{meaning:'공부 중 주의를 유지하고 방해 요소를 조절하며 시간을 사용하는 방식을 살펴봅니다.',strong:'공부에 집중하기 위한 환경과 시간을 스스로 조절할 수 있다고 느끼는 편입니다.',check:'집중이 어려운 시간이나 장소가 반복되는지 살펴보세요. 집중력이 부족하다고 단정하기보다 방해 요소와 피로도를 구분하는 것이 중요합니다.',student:'공부 시작 전 휴대폰 등 방해 요소 한 가지를 치우고, 20~30분 공부 후 실제 집중 정도를 돌아보세요.',parent:'집중하지 못한 순간을 지적하기보다 공부 장소와 휴식 시간을 함께 조정해 보세요. 조용한 환경이 항상 최선인지도 학생에게 물어보세요.'},
{meaning:'이해 여부를 확인하고 복습·오답 점검을 활용하는 학습 방식을 살펴봅니다.',strong:'배운 내용을 다시 확인하고 모르는 부분을 점검하는 학습 전략을 활용한다고 느끼는 편입니다.',check:'읽거나 밑줄을 긋는 활동만으로 충분히 이해했다고 느끼지는 않는지 점검해 보세요. 기억을 꺼내는 연습이 도움이 될 수 있습니다.',student:'공부를 마친 뒤 책을 덮고 핵심 개념 하나를 설명해 보세요. 틀린 문제는 정답보다 실수한 이유를 기록해 보세요.',parent:'공부 시간을 확인하는 질문 대신 오늘 배운 내용을 짧게 설명해 달라고 요청해 보세요. 답을 바로 알려주기보다 학생이 생각할 시간을 주세요.'},
{meaning:'시험 전 준비, 시험 중 점검, 시험 후 복기와 긴장 반응을 살펴봅니다.',strong:'시험을 준비하고 결과를 다음 학습으로 연결하려는 습관을 비교적 긍정적으로 평가합니다.',check:'준비를 충분히 해도 긴장이나 시간 부족으로 어려움을 겪을 수 있습니다. 준비 습관과 시험 중 감정 반응을 나누어 살펴보세요.',student:'시험 전에 확인할 항목 세 가지를 적고, 시험 후에는 점수와 별개로 다음에 바꿀 행동 한 가지를 정해 보세요.',parent:'시험 직후 점수부터 묻기보다 준비 과정에서 잘한 점과 어려웠던 점을 먼저 들어 주세요. 시험 결과를 학생의 능력 전체로 해석하지 않는 것이 좋습니다.'},
{meaning:'외부 지시 없이 공부를 시작하고 스스로 점검하며 필요할 때 도움을 구하는 정도를 살펴봅니다.',strong:'스스로 공부를 시작하고 어려움을 해결하려는 태도를 갖고 있다고 느끼는 편입니다.',check:'혼자 해내는 것만이 자기주도학습은 아닙니다. 도움이 필요한 때를 알고 적절히 질문하는 능력도 함께 살펴보세요.',student:'오늘 공부를 시작할 시각을 직접 정하고, 막히는 문제가 나오면 스스로 시도한 방법을 적은 뒤 질문해 보세요.',parent:'학생이 먼저 계획하고 선택할 기회를 주세요. 필요한 도움의 범위를 물어보고, 대신 해결해 주기보다 선택의 결과를 돌아보도록 도와주세요.'},
{meaning:'학습 과정에서의 자신감, 실패 경험, 감정 회복과 다시 시도하는 태도를 살펴봅니다.',strong:'어려움이나 실수 이후에도 다시 시도할 수 있다는 감각을 비교적 긍정적으로 평가하고 있습니다.',check:'틀린 문제나 낮은 점수를 자기 능력 전체에 대한 평가로 받아들이지는 않는지 살펴보세요. 일시적인 감정과 지속적인 어려움을 구분하는 것이 좋습니다.',student:'틀리거나 막혔던 문제 하나를 골라 다시 시도한 과정을 기록해 보세요. 잘 안된 날에도 다음에 할 수 있는 작은 행동을 정해 보세요.',parent:'실수했을 때 즉시 해결책을 제시하기보다 학생의 감정을 먼저 들어 주세요. 비교나 낙인보다 회복한 과정과 재도전을 인정해 주세요.'},
{meaning:'자신에게 맞는 공부 장소를 이해하고 가족·주변 사람에게 필요한 도움을 표현하는 정도를 살펴봅니다.',strong:'자신에게 도움이 되는 환경과 관계를 어느 정도 파악하고 있다고 느끼는 편입니다.',check:'공부 환경에 대한 학생과 보호자의 생각이 다를 수 있습니다. 방해 요소뿐 아니라 편안하게 도움을 요청할 수 있는 관계도 살펴보세요.',student:'집중이 잘되는 환경의 조건 두 가지와 도움이 필요할 때 요청할 수 있는 내용을 적어 보세요.',parent:'공부 공간과 소음, 도움의 방식에 대해 학생의 의견을 먼저 들어 주세요. 부모가 생각하는 좋은 환경과 학생이 실제로 편안한 환경이 다를 수 있습니다.'}
];
function levelText(v){return v>=70?'상대적으로 긍정적':v<=35?'함께 살펴볼 필요':'보통 범위'}
function areaDetail(i){let g=areaGuides[i],v=state.scores[i];return `<article class="area-detail"><div class="detail-top"><h3>${String(i+1).padStart(2,'0')} · ${areas[i]}</h3><span class="score-chip">${v}점</span></div><p class="small muted">${g.meaning}</p><p>${v>=70?g.strong:v<=35?g.check:g.strong+' '+g.check}</p><p class="detail-note">${v>=70?'유지해 볼 습관':v<=35?'점검해 볼 습관':'다음 단계'} · ${g.student}</p></article>`}
function pairAnalysis(){const s=state.scores,arr=[];
function add(a,b,cond,heading,detail){if(cond)arr.push({heading,detail})}
add(0,1,s[0]>=65&&s[1]<=40,'동기와 실행의 간격','공부의 의미는 비교적 분명하지만 계획을 행동으로 옮기는 과정은 어렵게 느낄 수 있습니다. 목표를 더 크게 잡기보다 오늘 바로 시작할 수 있는 작은 과제를 정해 보세요.');
add(1,2,s[1]>=65&&s[2]<=40,'계획과 집중의 간격','계획을 세우는 습관은 긍정적이지만 실제 공부 시간에는 방해 요소가 있을 수 있습니다. 계획표를 늘리기보다 시작 전 환경을 정리하는 과정에 집중해 보세요.');
add(3,4,s[3]>=65&&s[4]<=40,'학습 방법과 시험 대처의 차이','평소 이해와 복습 전략은 활용하지만 시험 상황에서의 준비나 긴장은 별도로 점검할 필요가 있습니다. 시간 제한을 둔 연습과 시험 후 복기를 함께 시도해 보세요.');
add(5,6,s[5]>=65&&s[6]<=40,'자기주도성과 학습 정서','스스로 해결하려는 태도가 있어도 실패나 실수에 대한 부담은 클 수 있습니다. 혼자 해결하는 것만을 목표로 하지 말고 적절히 도움을 요청하는 경험을 쌓아 보세요.');
add(2,7,s[2]<=40&&s[7]<=40,'집중과 환경의 연결','집중 유지와 학습 환경을 모두 점검할 필요가 있다고 느끼는 응답입니다. 의지의 문제로 보기보다 장소·소음·휴식 조건을 먼저 조정해 보세요.');
if(!arr.length){const max=Math.max(...s),min=Math.min(...s);if(max-min<=15)arr.push({heading:'비교적 고른 학습성향',detail:'8개 영역의 점수 차이가 크지 않습니다. 일부 영역을 강점이나 약점으로 단정하기보다 실제 공부 상황에서 어떤 습관이 잘 작동하는지 확인해 보세요.'});else {let hi=s.indexOf(max),lo=s.indexOf(min);arr.push({heading:'강점에서 출발하는 학습 조정',detail:`상대적으로 높게 응답한 ‘${areas[hi]}’의 습관을 활용해 ‘${areas[lo]}’의 어려움을 작게 조정해 볼 수 있습니다. 점수 차이는 학생의 자기평가 차이이며 능력의 우열을 뜻하지 않습니다.`})}}
return arr.slice(0,2)}
function topBottom(){let ranked=state.scores.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v),spread=ranked[0].v-ranked[7].v;if(spread<=15)return {balanced:true,hi:[],lo:[]};return {balanced:false,hi:ranked.slice(0,2),lo:ranked.slice(-2).reverse()}}
function report(){let profile=topBottom(),pairs=pairAnalysis(),ranked=state.scores.map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v),focus=ranked.slice(0,3),name=esc(state.info.name),date=new Date().toLocaleDateString('ko-KR');
let summary=profile.balanced?`8개 영역의 점수 차이가 비교적 작습니다. 특정 영역을 강점이나 약점으로 단정하기보다, 실제 학습 상황에서 잘 작동하는 습관을 관찰하는 것이 좋습니다.`:`상대적으로 높게 응답한 영역은 ‘${areas[profile.hi[0].i]}’와 ‘${areas[profile.hi[1].i]}’입니다. 반면 ‘${areas[profile.lo[0].i]}’와 ‘${areas[profile.lo[1].i]}’는 함께 살펴볼 만한 영역입니다. 이는 학생이 자신의 학습 습관을 어떻게 느끼는지 보여주는 것으로, 실제 능력을 확정하는 평가는 아닙니다.`;

<section class="reportpage"><div class="report-section">03 / CONNECTIONS</div><h2>영역을 함께 살펴보면</h2><p class="muted">하나의 점수보다 여러 영역의 관계를 보면 실천 방향을 찾는 데 도움이 됩니다.</p>${pairs.map(x=>`<div class="insight"><h3>${x.heading}</h3><p>${x.detail}</p></div>`).join('')}<h3>이번 검사에서 기억할 점</h3><p>점수가 낮은 영역을 모두 한 번에 바꾸려 하지 않아도 됩니다. 현재 가장 불편하게 느끼는 상황을 하나 고르고, 작게 시도한 뒤 다시 점검하는 방식이 현실적입니다.</p><div class="note">이 보고서는 학습 습관을 돌아보는 자기보고식 참고 자료입니다. 표준화·타당화된 심리검사나 전문 진단을 대신하지 않습니다.</div></section>
<section class="reportpage"><div class="report-section">04 / FOR STUDENTS</div><h2>${name} 학생을 위한 실천 가이드</h2><p class="lead">가장 필요한 것은 완벽한 계획이 아니라, 실제로 해볼 수 있는 작은 변화입니다.</p>${focus.map((x,j)=>`<div class="action-item"><div class="action-no">${j+1}</div><div><h3>${areas[x.i]}</h3><p>${areaGuides[x.i].student}</p></div></div>`).join('')}<h3>7일 실천 기록</h3><div class="weekly">${['월','화','수','목','금','토','일'].map(x=>`<div><span>${x}</span><span class="check-square">□</span></div>`).join('')}</div><p class="small muted">위 실천 방법 중 한 가지를 선택해 7일 동안 시도해 보세요. 체크 횟수보다 무엇이 도움이 됐는지 돌아보는 것이 중요합니다.</p></section>
<section class="reportpage"><div class="report-section">05 / FOR PARENTS</div><h2>학부모님을 위한 이해와 지원 가이드</h2><p class="lead">학생이 스스로 공부하는 힘을 키울 수 있도록, 필요한 도움의 방식부터 함께 찾아보세요.</p>${focus.map((x,j)=>`<div class="parent-tip"><span class="tip-label">가이드 ${j+1} · ${areas[x.i]}</span><p>${areaGuides[x.i].parent}</p></div>`).join('')}<h3>함께 대화해 볼 질문</h3><p>“이번 주 공부하면서 가장 잘된 순간은 언제였니?”</p><p>“다음에는 무엇을 조금 바꿔 보면 좋을까?”</p><p>“엄마·아빠가 도와주면 좋은 부분이 있을까?”</p><div class="note">학생의 답변과 실제 생활 모습을 함께 살펴보세요. 한 번의 검사로 성격이나 학습 능력을 단정하지 않는 것이 중요합니다.</div></section>
<section class="reportpage"><div class="report-section">06 / NEXT STEP</div><h2>다음 주, 한 가지부터 시작해 보세요</h2><p>이번 보고서에서 가장 공감되는 조언을 하나 골라 일주일 동안 실천해 보세요. 학생은 시도한 경험을 기록하고, 학부모는 결과를 평가하기보다 변화를 함께 관찰해 주시면 좋겠습니다.</p><div class="reflection"><b>이번 주에 시도할 한 가지</b><div class="writing-line"></div><b>일주일 뒤 느낀 점</b><div class="writing-line"></div></div><div class="end-brand">TES EDU</div><p class="muted small">검사 결과는 별도로 보관되지 않습니다. 필요한 경우 PDF로 저장해 주세요. 상담 시 저장한 결과를 가져오시면 됩니다.</p></section></div>

async function shareResult(){let t=`TES EDU 학습성향 진단 · ${state.info.name} · ${gradeName(state.info.grade)}\n`+areas.map((a,i)=>`${a}: ${state.scores[i]}점`).join('\n')+'\n※ 자기보고식 점검 결과 · TES 서버 미보관';if(navigator.share){try{await navigator.share({title:'TES EDU 학습성향 진단 요약',text:t});return}catch(e){if(e.name==='AbortError')return}}if(navigator.clipboard&&location.protocol==='https:'){try{await navigator.clipboard.writeText(t);alert('요약 결과를 복사했습니다.');return}catch(e){}}window.prompt('아래 요약을 복사해 공유하세요.',t)}
function restart(){state={page:'intro',index:0,answers:Array(64).fill(null),info:{grade:'elem',name:''},scores:[]};render()}
function render(){if(state.page==='intro')intro();else if(state.page==='question')question();else if(state.page==='result')report();}
render();
</script></body></html>
